<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - StarMovies</title>
  <link rel="stylesheet" href="../4-GERAL/StyleContato.css"> <!-- Link para o arquivo CSS -->
  <link rel="icon" href="../6-IMG/Logo1.png" type="image/x-icon">
</head>
<body>
  <!-- HEADER -->
  <header>
    <div class="logo">
      <h1>StarMovies</h1>
    </div>
    <nav>
      <ul>
        <li><a href="../1-HOMEPAGE/index.html">Início</a></li>
        <li><a href="../2-PAGES/filmes.html">Filmes</a></li>
        <li><a href="../2-PAGES/series.html">Séries</a></li>
        <li><a href="../2-PAGES/contato.html">Contato</a></li>
        <li class="search">
        </li>
      </ul>
    </nav>
    
  </header>

  <!-- Faixa laranja abaixo do header -->
  <div class="orange-bar"></div>

  <!-- Seção de Contato -->
  <div class="contato">
    <h2>Entre em Contato</h2>
    <p>Se você tem alguma dúvida ou sugestão, preencha o formulário abaixo e entraremos em contato.</p>

    <form action="#" method="POST">
      <div class="form-group">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>
      </div>

      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 StarMovies. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
